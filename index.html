<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>For Anshika ❤️</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Poppins:wght@300;500&display=swap" rel="stylesheet">
  
  <style>
    body {
      margin: 0;
      background: #000;
      color: white;
      font-family: 'Poppins', sans-serif;
      overflow: hidden;
      height: 100vh;
    }

    /* Slideshow: Bright and Clear */
    #slideshow {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
    }

    .slide {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity 2s ease-in-out;
      filter: brightness(80%); /* Photos are nice and bright */
    }

    .slide.active { opacity: 1; }

    /* Opening Screen */
    #start-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at center, #5a0000, #000);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      cursor: pointer;
    }

    #start-btn {
      padding: 15px 40px;
      font-size: 1.1rem;
      background: #ff4d6d;
      color: white;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 5px 20px rgba(255, 77, 109, 0.5);
    }

    /* CONTENT BOX - Bottom Left (Sticker Style) */
    .overlay {
      position: absolute;
      bottom: 30px; 
      left: 20px;   
      width: auto;
      display: none; /* Hidden until start */
      z-index: 50;
    }

    .glass-box {
      background: rgba(0, 0, 0, 0.7); 
      backdrop-filter: blur(10px);
      padding: 20px 25px;
      border-radius: 20px;
      border-left: 4px solid #ff4d6d; /* Pink accent line */
      width: 300px; /* Small width to not cover photos */
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      transition: height 0.3s ease;
    }

    /* Quiz Styles */
    .quiz-question {
      font-family: 'Dancing Script', cursive;
      font-size: 1.4rem;
      color: #ff4d6d;
      margin-bottom: 15px;
      line-height: 1.3;
    }

    .option-btn {
      display: block;
      width: 100%;
      margin: 8px 0;
      padding: 10px;
      border-radius: 15px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.1);
      color: white;
      font-size: 0.9rem;
      cursor: pointer;
      text-align: left;
      padding-left: 15px;
    }

    .option-btn:active {
      background: #ff4d6d;
      border-color: #ff4d6d;
    }

    /* Greeting Text Style */
    .greeting-text {
      font-family: 'Dancing Script', cursive;
      font-size: 1.5rem;
      line-height: 1.4;
      color: #fff;
      min-height: 60px;
      display: flex;
      align-items: center;
    }

    .fadeIn { animation: fadeInAnim 1.5s forwards; }
    @keyframes fadeInAnim {
      from { opacity: 0; transform: translateX(-10px); }
      to { opacity: 1; transform: translateX(0); }
    }

    .heart {
      position: fixed;
      bottom: -20px;
      font-size: 20px;
      animation: floatUp 6s linear forwards;
      pointer-events: none;
      z-index: 10;
    }

    @keyframes floatUp {
      0% { transform: translateY(0) rotate(0deg); opacity: 1; }
      100% { transform: translateY(-110vh) rotate(360deg); opacity: 0; }
    }
  </style>
</head>

<body>

  <div id="start-screen" onclick="startExperience()">
    <div style="font-size: 50px; margin-bottom: 15px;">💌</div>
    <h2 style="font-family: 'Dancing Script'; font-size: 2rem;">For Anshika ❤️</h2>
    <button id="start-btn">Open Surprise 💕</button>
  </div>

  <div id="slideshow">
    <img src="1.jpg" class="slide active">
    <img src="2.jpg" class="slide">
    <img src="3.jpg" class="slide">
    <img src="4.jpg" class="slide">
    <img src="5.jpg" class="slide">
    <img src="6.jpg" class="slide">
    <img src="7.jpg" class="slide">
    <img src="8.jpg" class="slide">
    <img src="9.jpg" class="slide">
    <img src="10.jpg" class="slide">
  </div>

  <audio id="bgMusic" loop preload="auto">
    <source src="music.mp3" type="audio/mpeg">
  </audio>

  <div class="overlay" id="main-content">
    <div class="glass-box" id="box-content">
      </div>
  </div>

  <script>
    const music = document.getElementById("bgMusic");
    const startScreen = document.getElementById("start-screen");
    const mainContent = document.getElementById("main-content");
    const boxContent = document.getElementById("box-content");
    const slides = document.querySelectorAll(".slide");

    // --- QUIZ DATA ---
    const quiz = [
      {
        q: "Anshika, jab tum humare baare mein sochti ho, sabse pehle kya yaad aata hai? 💕",
        o: ["Chhoti chhoti fights 😅", "Random hasi-masti 😂", "Late-night baatein 🌙", "Sab kuch, hamesha ❤️"]
      },
      {
        q: "Anshika, tumhe bina kisi wajah ke kya smile karwa deta hai? 😊",
        o: ["Food 🍫", "Music 🎧", "Purani yaadein 🫶", "Main jab thoda silly ho jaata hoon 🤍"]
      },
      {
        q: "Agar hum dono shaant baith kar saath ho, Anshika, tum kya choose karogi? 🌸",
        o: ["Endless baatein 🗣️", "Comfortable silence 🌿", "Haath pakad ke baithna 🤝", "Sab kuch saath mein 💖"]
      },
      {
        q: "Anshika, is naye saal mein humare liye tum kya chahogi? 🎆",
        o: ["Zyada smiles 😊", "Kam misunderstandings 🌸", "Aur strong bond 🤞", "Sab kuch saath-saath ❤️"]
      }
    ];

    // --- GREETING MESSAGES ---
    const messages = [
      "Happy New Year, Anshika ❤️🎆",
      "Ye saal mere liye aasaan nahi tha… 🌧️",
      "Shayad tumhare liye bhi nahi 😔",
      "Par ek baat jo kabhi kam nahi hui…",
      "Wo tha mera pyaar tumhare liye 💖",
      "Kabhi kabhi main apni baat sahi tarah se keh nahi paata…",
      "Aur isi chakkar mein tumhe hurt kar deta hoon 💔",
      "Uske liye mujhe dil se afsos hai 🤍",
      "Par meri feelings kabhi fake nahi thi…",
      "Na kal, na aaj, na kabhi ✨",
      "Anshika, tum meri life ka wo hissa ho…",
      "Jahan main sukoon mehsoos karta hoon 🫶",
      "Tumhari ek smile… 😊",
      "Mere hazaar problems ko shaant kar deti hai",
      "Is naye saal mein 🎊",
      "Main effort dikhana chahta hoon 🌱",
      "Tumhara saath nibhana chahta hoon 🤞",
      "Tumhari aankhon mein khushi dekhna chahta hoon 🥺❤️",
      "Chahe raahein perfect na ho…",
      "Par mera irada hamesha saccha rahega 💞",
      "Anshika, main tumhe khona nahi chahta…",
      "Main tumhe hamesha chahna chahta hoon 💫",
      "Iss saal bhi… aur aane wale har saal mein ✨",
      "Sirf tum, Anshika ❤️"
    ];

    let currentQuiz = 0;
    let msgIndex = 0;
    let slideIndex = 0;

    // --- LOGIC START ---

    function nextSlide() {
      slides[slideIndex].classList.remove("active");
      slideIndex = (slideIndex + 1) % slides.length;
      slides[slideIndex].classList.add("active");
    }

    function createHeart() {
      const heart = document.createElement("div");
      heart.className = "heart";
      heart.innerHTML = "❤️";
      heart.style.left = Math.random() * 100 + "vw";
      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), 6000);
    }

    function startExperience() {
      startScreen.style.display = "none";
      mainContent.style.display = "block";
      
      music.load();
      music.play().catch(() => {
          document.addEventListener('click', () => music.play(), {once: true});
      });
      
      setInterval(nextSlide, 5000);
      setInterval(createHeart, 500);
      
      // Start with Quiz
      loadQuizQuestion();
    }

    // --- QUIZ FUNCTIONS ---
    function loadQuizQuestion() {
      const qData = quiz[currentQuiz];
      
      let html = `<div class="quiz-question fadeIn">${qData.q}</div>`;
      qData.o.forEach(opt => {
        html += `<button class="option-btn fadeIn" onclick="nextQuiz()">${opt}</button>`;
      });
      
      boxContent.innerHTML = html;
    }

    function nextQuiz() {
      currentQuiz++;
      if (currentQuiz < quiz.length) {
        // Add slight delay for smoothness
        boxContent.style.opacity = 0;
        setTimeout(() => {
          loadQuizQuestion();
          boxContent.style.opacity = 1;
        }, 300);
      } else {
        // Quiz Finished -> Start Greetings
        boxContent.style.opacity = 0;
        setTimeout(() => {
          startGreetings();
          boxContent.style.opacity = 1;
        }, 500);
      }
    }

    // --- GREETING FUNCTIONS ---
    function startGreetings() {
      updateGreeting();
      setInterval(updateGreeting, 4500);
    }

    function updateGreeting() {
      // Fade out
      const textDiv = document.getElementById("greetingMsg");
      
      // If first time running, set up the structure
      if (!textDiv) {
        boxContent.innerHTML = `<div id="greetingMsg" class="greeting-text"></div>`;
        document.getElementById("greetingMsg").innerHTML = messages[0];
        msgIndex = 1;
        return;
      }

      textDiv.style.opacity = 0;
      setTimeout(() => {
        textDiv.innerHTML = messages[msgIndex];
        textDiv.classList.remove("fadeIn");
        void textDiv.offsetWidth; // Trigger reflow
        textDiv.classList.add("fadeIn");
        textDiv.style.opacity = 1;
        msgIndex = (msgIndex + 1) % messages.length;
      }, 500);
    }
  </script>
</body>
</html>
