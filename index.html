<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>For Anshika ❤️</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Poppins:wght@300;500&display=swap" rel="stylesheet">
  
  <style>
    body {
      margin: 0;
      background: #000;
      color: white;
      font-family: 'Poppins', sans-serif;
      overflow: hidden;
      height: 100vh;
    }

    /* --- SLIDESHOW SECTION --- */
    #slideshow {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
    }

    .slide {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity 2s ease-in-out;
      /* Photos are kept bright so they look good */
      filter: brightness(85%); 
    }

    .slide.active { opacity: 1; }

    /* --- START SCREEN --- */
    #start-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at center, #5a0000, #000);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      cursor: pointer;
    }

    .envelope-icon {
      font-size: 60px;
      margin-bottom: 15px;
      animation: bounce 2s infinite;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-15px); }
    }

    #start-btn {
      padding: 15px 45px;
      font-size: 1.2rem;
      background: #ff4d6d;
      color: white;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 5px 25px rgba(255, 77, 109, 0.6);
      font-family: 'Poppins', sans-serif;
      font-weight: 500;
    }

    /* --- MAIN CONTENT BOX (Bottom Left) --- */
    .overlay {
      position: absolute;
      bottom: 40px; 
      left: 20px;   
      width: auto;
      display: none; /* Hidden until clicked */
      z-index: 50;
    }

    .glass-box {
      background: rgba(0, 0, 0, 0.65); 
      backdrop-filter: blur(12px);
      padding: 25px;
      border-radius: 20px;
      border-left: 5px solid #ff4d6d; /* Romantic pink line */
      width: 300px; /* Kept small to not block photos */
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      transition: all 0.5s ease;
    }

    /* Quiz Styling */
    .quiz-question {
      font-family: 'Dancing Script', cursive;
      font-size: 1.5rem;
      color: #ff4d6d;
      margin-bottom: 15px;
      line-height: 1.3;
    }

    .option-btn {
      display: block;
      width: 100%;
      margin: 10px 0;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      background: rgba(255, 255, 255, 0.1);
      color: white;
      font-size: 0.95rem;
      cursor: pointer;
      text-align: left;
      padding-left: 15px;
      transition: background 0.3s;
    }

    .option-btn:active {
      background: #ff4d6d;
      border-color: #ff4d6d;
    }

    /* Greetings Styling */
    .greeting-text {
      font-family: 'Dancing Script', cursive;
      font-size: 1.6rem;
      line-height: 1.4;
      color: #fff;
      min-height: 80px;
      display: flex;
      align-items: center;
    }

    /* Animations */
    .fadeIn { animation: fadeInAnim 1s forwards; }
    @keyframes fadeInAnim {
      from { opacity: 0; transform: translateX(-10px); }
      to { opacity: 1; transform: translateX(0); }
    }

    .heart {
      position: fixed;
      bottom: -20px;
      font-size: 20px;
      animation: floatUp 6s linear forwards;
      pointer-events: none;
      z-index: 10;
    }

    @keyframes floatUp {
      0% { transform: translateY(0) rotate(0deg); opacity: 1; }
      100% { transform: translateY(-110vh) rotate(360deg); opacity: 0; }
    }
  </style>
</head>

<body>

  <div id="start-screen" onclick="startExperience()">
    <div class="envelope-icon">💌</div>
    <h2 style="font-family: 'Dancing Script'; font-size: 2.2rem; margin-top:0;">For Anshika ❤️</h2>
    <button id="start-btn">Click for Magic ✨</button>
  </div>

  <div id="slideshow">
    <img src="1.jpg" class="slide active">
    <img src="2.jpg" class="slide">
    <img src="3.jpg" class="slide">
    <img src="4.jpg" class="slide">
    <img src="5.jpg" class="slide">
    <img src="6.jpg" class="slide">
    <img src="7.jpg" class="slide">
    <img src="8.jpg" class="slide">
    <img src="9.jpg" class="slide">
    <img src="10.jpg" class="slide">
  </div>

  <audio id="bgMusic" loop preload="auto">
    <source src="music.mp3" type="audio/mpeg">
  </audio>

  <div class="overlay" id="main-content">
    <div class="glass-box" id="box-content">
      </div>
  </div>

  <script>
    const music = document.getElementById("bgMusic");
    const startScreen = document.getElementById("start-screen");
    const mainContent = document.getElementById("main-content");
    const boxContent = document.getElementById("box-content");
    const slides = document.querySelectorAll(".slide");

    // --- 1. THE QUIZ DATA ---
    const quiz = [
      {
        q: "Anshika, jab tum humare baare mein sochti ho, sabse pehle kya yaad aata hai? 💕",
        o: ["Chhoti chhoti fights 😅", "Random hasi-masti 😂", "Late-night baatein 🌙", "Sab kuch, hamesha ❤️"]
      },
      {
        q: "Anshika, tumhe bina kisi wajah ke kya smile karwa deta hai? 😊",
        o: ["Food 🍫", "Music 🎧", "Purani yaadein 🫶", "Main jab thoda silly ho jaata hoon 🤍"]
      },
      {
        q: "Agar hum dono shaant baith kar saath ho, Anshika, tum kya choose karogi? 🌸",
        o: ["Endless baatein 🗣️", "Comfortable silence 🌿", "Haath pakad ke baithna 🤝", "Sab kuch saath mein 💖"]
      },
      {
        q: "Anshika, is naye saal mein humare liye tum kya chahogi? 🎆",
        o: ["Zyada smiles 😊", "Kam misunderstandings 🌸", "Aur strong bond 🤞", "Sab kuch saath-saath ❤️"]
      }
    ];

    // --- 2. THE GREETING MESSAGES ---
    const messages = [
      "Happy New Year, Anshika ❤️🎆",
      "Ye saal mere liye aasaan nahi tha… 🌧️",
      "Shayad tumhare liye bhi nahi 😔",
      "Par ek baat jo kabhi kam nahi hui…",
      "Wo tha mera pyaar tumhare liye 💖",
      "Kabhi kabhi main apni baat sahi tarah se keh nahi paata…",
      "Aur isi chakkar mein tumhe hurt kar deta hoon 💔",
      "Uske liye mujhe dil se afsos hai 🤍",
      "Par meri feelings kabhi fake nahi thi…",
      "Na kal, na aaj, na kabhi ✨",
      "Anshika, tum meri life ka wo hissa ho…",
      "Jahan main sukoon mehsoos karta hoon 🫶",
      "Tumhari ek smile… 😊",
      "Mere hazaar problems ko shaant kar deti hai",
      "Is naye saal mein 🎊",
      "Main sirf baatein nahi…",
      "Main effort dikhana chahta hoon 🌱",
      "Tumhara saath nibhana chahta hoon 🤞",
      "Tumhari aankhon mein khushi dekhna chahta hoon 🥺❤️",
      "Chahe raahein perfect na ho…",
      "Par mera irada hamesha saccha rahega 💞",
      "Anshika, main tumhe khona nahi chahta…",
      "Main tumhe hamesha chahna chahta hoon 💫",
      "Iss saal bhi… aur aane wale har saal mein ✨",
      "Sirf tum, Anshika ❤️"
    ];

    let currentQuiz = 0;
    let msgIndex = 0;
    let slideIndex = 0;

    // --- 3. CORE FUNCTIONS ---

    function nextSlide() {
      slides[slideIndex].classList.remove("active");
      slideIndex = (slideIndex + 1) % slides.length;
      slides[slideIndex].classList.add("active");
    }

    function createHeart() {
      const heart = document.createElement("div");
      heart.className = "heart";
      heart.innerHTML = "❤️";
      heart.style.left = Math.random() * 100 + "vw";
      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), 6000);
    }

    function startExperience() {
      startScreen.style.display = "none";
      mainContent.style.display = "block";
      
      // Attempt to play music
      music.load();
      music.play().catch(() => {
          // Retry on interaction if auto-play fails
          document.addEventListener('click', () => music.play(), {once: true});
      });
      
      setInterval(nextSlide, 5000);
      setInterval(createHeart, 500);
      
      // BEGIN WITH QUIZ
      loadQuizQuestion();
    }

    // --- 4. QUIZ LOGIC ---
    function loadQuizQuestion() {
      const qData = quiz[currentQuiz];
      
      // Create HTML for Question + Options
      let html = `<div class="quiz-question fadeIn">${qData.q}</div>`;
      qData.o.forEach(opt => {
        html += `<button class="option-btn fadeIn" onclick="nextQuiz()">${opt}</button>`;
      });
      
      boxContent.innerHTML = html;
    }

    function nextQuiz() {
      currentQuiz++;
      
      // If there are more questions, show next one
      if (currentQuiz < quiz.length) {
        boxContent.style.opacity = 0;
        setTimeout(() => {
          loadQuizQuestion();
          boxContent.style.opacity = 1;
        }, 300);
      } 
      // If quiz ended, Switch to Greetings
      else {
        boxContent.style.opacity = 0;
        setTimeout(() => {
          startGreetings();
          boxContent.style.opacity = 1;
        }, 500);
      }
    }

    // --- 5. GREETING LOGIC ---
    function startGreetings() {
      // First, show the first message immediately
      updateGreeting(); 
      // Then rotate them every 4.5 seconds
      setInterval(updateGreeting, 4500);
    }

    function updateGreeting() {
      const textDiv = document.getElementById("greetingMsg");
      
      // Setup the container if it's the first time running
      if (!textDiv) {
        boxContent.innerHTML = `<div id="greetingMsg" class="greeting-text"></div>`;
        document.getElementById("greetingMsg").innerHTML = messages[0];
        msgIndex = 1;
        return;
      }

      // Fade out old message
      textDiv.style.opacity = 0;
      
      setTimeout(() => {
        // Change text and Fade In
        textDiv.innerHTML = messages[msgIndex];
        textDiv.classList.remove("fadeIn");
        void textDiv.offsetWidth; // reset animation
        textDiv.classList.add("fadeIn");
        textDiv.style.opacity = 1;
        
        msgIndex = (msgIndex + 1) % messages.length;
      }, 500);
    }
  </script>
</body>
</html>
