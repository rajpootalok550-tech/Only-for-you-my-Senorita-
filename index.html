  <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>For Anshika ❤️</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Poppins:wght@300;500&display=swap" rel="stylesheet">
  
  <style>
    body {
      margin: 0;
      background: #000;
      color: white;
      font-family: 'Poppins', sans-serif;
      overflow: hidden;
      height: 100vh;
    }

    /* Slideshow */
    #slideshow {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
    }

    .slide {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity 2s ease-in-out;
      filter: brightness(60%); /* Slightly darker so text is readable */
    }

    .slide.active { opacity: 1; }

    /* Start Screen */
    #start-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at center, #5a0000, #000);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      cursor: pointer;
    }

    #start-btn {
      padding: 15px 40px;
      font-size: 1.1rem;
      background: #ff4d6d;
      color: white;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 5px 20px rgba(255, 77, 109, 0.5);
    }

    /* THE QUIZ CONTAINER */
    .overlay {
      position: absolute;
      bottom: 50px;       /* Positioned near bottom for easy thumb reach */
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 400px;   /* Keeps it looking like a nice card */
      display: none;      /* Hidden until clicked */
      z-index: 50;
    }

    .quiz-box {
      background: rgba(0, 0, 0, 0.6); /* Dark Glass Effect */
      backdrop-filter: blur(12px);
      padding: 25px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      text-align: center;
      animation: popUp 0.8s ease-out;
    }

    @keyframes popUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .quiz-box h2 {
      font-family: 'Dancing Script', cursive; /* Romantic Font for Questions */
      font-size: 1.6rem;
      margin-top: 0;
      margin-bottom: 20px;
      color: #ff4d6d; /* Pink color for the question */
      line-height: 1.4;
    }

    .option-btn {
      display: block;
      width: 100%;
      margin: 10px 0;
      padding: 12px;
      border-radius: 50px;
      border: 1px solid rgba(255, 77, 109, 0.3);
      background: rgba(255, 255, 255, 0.1);
      color: white;
      font-size: 1rem;
      font-family: 'Poppins', sans-serif;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .option-btn:active {
      transform: scale(0.98);
      background: #ff4d6d;
    }

    .heart {
      position: fixed;
      bottom: -20px;
      font-size: 20px;
      animation: floatUp 6s linear forwards;
      pointer-events: none;
      z-index: 10;
    }

    @keyframes floatUp {
      0% { transform: translateY(0) rotate(0deg); opacity: 1; }
      100% { transform: translateY(-110vh) rotate(360deg); opacity: 0; }
    }
    
    /* End Message Style */
    .final-msg {
        font-size: 1.1rem;
        line-height: 1.6;
    }
  </style>
</head>

<body>

  <div id="start-screen" onclick="startExperience()">
    <div style="font-size: 60px; margin-bottom: 10px;">💌</div>
    <h2 style="font-family: 'Dancing Script'; font-size: 2rem;">For Anshika ❤️</h2>
    <button id="start-btn">Tap to Play 💕</button>
  </div>

  <div id="slideshow">
    <img src="1.jpg" class="slide active">
    <img src="2.jpg" class="slide">
    <img src="3.jpg" class="slide">
    <img src="4.jpg" class="slide">
    <img src="5.jpg" class="slide">
    <img src="6.jpg" class="slide">
    <img src="7.jpg" class="slide">
    <img src="8.jpg" class="slide">
    <img src="9.jpg" class="slide">
    <img src="10.jpg" class="slide">
  </div>

  <audio id="bgMusic" loop preload="auto">
    <source src="music.mp3" type="audio/mpeg">
  </audio>

  <div class="overlay" id="main-content">
    <div class="quiz-box">
      <h2 id="question"></h2>
      <div id="options"></div>
    </div>
  </div>

  <script>
    const music = document.getElementById("bgMusic");
    const startScreen = document.getElementById("start-screen");
    const mainContent = document.getElementById("main-content");
    const slides = document.querySelectorAll(".slide");

    // Your lovely questions
    const quiz = [
      {
        q: "Anshika, jab tum humare baare mein sochti ho, sabse pehle kya yaad aata hai? 💕",
        o: ["Chhoti chhoti fights 😅", "Random hasi-masti 😂", "Late-night baatein 🌙", "Sab kuch, hamesha ❤️"]
      },
      {
        q: "Anshika, tumhe bina kisi wajah ke kya smile karwa deta hai? 😊",
        o: ["Food 🍫", "Music 🎧", "Purani yaadein 🫶", "Main jab thoda silly ho jaata hoon 🤍"]
      },
      {
        q: "Agar hum dono shaant baith kar saath ho, Anshika, tum kya choose karogi? 🌸",
        o: ["Endless baatein 🗣️", "Comfortable silence 🌿", "Haath pakad ke baithna 🤝", "Sab kuch saath mein 💖"]
      },
      {
        q: "Anshika, is naye saal mein humare liye tum kya chahogi? 🎆",
        o: ["Zyada smiles 😊", "Kam misunderstandings 🌸", "Aur strong bond 🤞", "Sab kuch saath-saath ❤️"]
      }
    ];

    let current = 0;
    let slideIndex = 0;
    const qEl = document.getElementById("question");
    const optEl = document.getElementById("options");

    // Slideshow Logic
    function nextSlide() {
      slides[slideIndex].classList.remove("active");
      slideIndex = (slideIndex + 1) % slides.length;
      slides[slideIndex].classList.add("active");
    }

    // Flying Hearts Logic
    function createHeart() {
      const heart = document.createElement("div");
      heart.className = "heart";
      heart.innerHTML = "❤️";
      heart.style.left = Math.random() * 100 + "vw";
      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), 6000);
    }

    // Start Everything
    function startExperience() {
      startScreen.style.display = "none";
      mainContent.style.display = "block";
      
      // Play Music
      music.load();
      music.play().catch(() => {
          document.addEventListener('click', () => music.play(), {once: true});
      });
      
      setInterval(nextSlide, 4000); // Change photo every 4s
      setInterval(createHeart, 600);
      loadQuestion(); // Start the Quiz
    }

    // Quiz Logic
    function loadQuestion() {
      // Fade effect for new question
      qEl.style.opacity = 0;
      optEl.style.opacity = 0;
      
      setTimeout(() => {
        qEl.innerHTML = quiz[current].q;
        optEl.innerHTML = "";
        
        quiz[current].o.forEach(option => {
          const btn = document.createElement("button");
          btn.className = "option-btn";
          btn.innerHTML = option;
          btn.onclick = () => {
             // Add a small click animation or sound here if you want
             nextQuestion();
          };
          optEl.appendChild(btn);
        });
        
        qEl.style.opacity = 1;
        optEl.style.opacity = 1;
      }, 300);
    }

    function nextQuestion() {
      current++;
      if (current < quiz.length) {
        loadQuestion();
      } else {
        showEnd();
      }
    }

    function showEnd() {
      qEl.innerHTML = "Thank you, Anshika 🤍";
      optEl.innerHTML = `
        <div class="final-msg">
          <p>Mujhe sahi jawab nahi chahiye the…<br>
          Bas tumhara dil samajhna tha 💖</p>
          <br>
          <p>Happy New Year, Anshika 🎆<br>
          Main hamesha tumhare saath hoon ✨</p>
          <br>
          <p style="font-size:0.9rem; opacity:0.8;">(Photos will keep playing... enjoy the song 🎶)</p>
        </div>
      `;
    }
  </script>
</body>
</html>
